<main>
    <figure>
        <img src="../assets/Diegote firmando.jpg" alt="Diego Maradona firmando contrato"
        width="200">
    </figure>
    <h2 id="contacto">
         <p>Ubicacion: Caballito CABA</p>
         <P>Redes Sociales: @fulboestadisticas</P>
        </h2>
    </section>

    <section>
    <article>
           <h2>Inscripcion</h2>
           <p>Anotate para recibir toda la informacion</p>
            <form>
                <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text"
                 placeholder="Escribe tu Nombre"
                 required 
                 id="nombre">
                 </div>
                
                 <div class="campo">
                 <label for="edad">Edad</label>
                <input type="number"
                 placeholder="Cuantos años tenes"
                 required
                 id="edad">
                 </div>
                
                <div class="campo">
                <label for="correo-electronico">Correo Electronico:</label>
                <input type="email"
                 placeholder="ejemplo@gmail.com"
                 required
                 id="correo-electronico">
                </div>        
    
                <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input type="password"
                placeholder="contraseña"
                required
                id="contraseña">
                </div>
        
                <div class="campo">
                <label for="fecha-de-nacimiento">Fecha de nacimiento</label>
                <input type="date"
                required
                id="fecha-de-nacimiento">
                </div>
                
                <div class="campo">
                <label>Estas preparado para la mejor información</label>
                <input type="checkbox" required>
                </div>
        
                <button>Enviar</button>
            </form>   
    </article>
 </section>
</main>
